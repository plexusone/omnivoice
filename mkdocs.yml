site_name: OmniVoice
site_url: https://plexusone.github.io/omnivoice/
site_description: Batteries-included voice pipeline framework for Go
site_author: PlexusOne

repo_name: plexusone/omnivoice
repo_url: https://github.com/plexusone/omnivoice

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - CLI: guides/cli.md
      - Text-to-Speech: guides/tts.md
      - Speech-to-Text: guides/stt.md
      - Voice Calls: guides/voice-calls.md
      - SMS Messaging: guides/sms.md
      - Streaming: guides/streaming.md
      - Subtitles: guides/subtitles.md
      - Voice Agents: guides/voice-agents.md
      - Provider Registry: guides/registry.md
      - Multi-Provider Failover: guides/failover.md
      - Providers:
          - Overview: guides/providers/index.md
          - OpenAI: guides/providers/openai.md
          - ElevenLabs: guides/providers/elevenlabs.md
          - Deepgram: guides/providers/deepgram.md
          - Twilio: guides/providers/twilio.md
          - Telnyx: guides/providers/telnyx.md
  - Design:
      - Architecture:
          - OmniX Philosophy: design/architecture/omnix-philosophy.md
  - Specs:
      - AX Integration:
          - PRD: specs/ax-integration/PRD.md
          - TRD: specs/ax-integration/TRD.md
          - Plan: specs/ax-integration/PLAN.md
  - Releases:
      - v0.13.0: releases/v0.13.0.md
      - v0.12.0: releases/v0.12.0.md
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - v0.9.0: releases/v0.9.0.md
      - v0.8.0: releases/v0.8.0.md
      - v0.7.1: releases/v0.7.1.md
      - v0.7.0: releases/v0.7.0.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
  - Changelog: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
